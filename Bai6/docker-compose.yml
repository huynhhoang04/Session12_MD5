version: '3'
services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - user-service
      - order-service

  user-service:
    image: my-user-api
    networks:
      - app-network

  order-service:
    image: my-order-api
    networks:
      - app-network

  db:
    image: postgres:15
    networks:
      - app-network
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret

networks:
  app-network:
    driver: bridge